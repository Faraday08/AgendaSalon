name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite lanzar el despliegue a mano (lo usa scripts/monsterasp/configurar-github.ps1).

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior,
# excepto en main, para no cortar un despliegue a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # La restauración falla si algún paquete tiene vulnerabilidades conocidas
      # (las advertencias de NuGet se tratan como errores en Directory.Build.props).
      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      # Las pruebas de integración usan SQLite en memoria, así que no hace falta SQL Server.
      - name: Ejecutar pruebas
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFilePrefix=resultados"
          --results-directory resultados-pruebas

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: resultados-pruebas
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm run test:ci

      # El build también revisa los tipos con tsc.
      - name: Build
        run: npm run build

  # ---------- Despliegue (solo main, con las pruebas en verde y el hosting ya configurado) ----------
  # Las variables y el secreto los guarda scripts/monsterasp/configurar-github.ps1. Mientras no existan, se omiten.

  desplegar-api:
    name: Desplegar la API en MonsterASP
    needs: [compilar-y-probar, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MONSTERASP_SITIO != ''
    runs-on: windows-latest # Web Deploy (msdeploy) viene instalado en los runners de Windows.
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.API_URL }}/salud
    permissions:
      contents: read

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # MonsterASP corre IIS en Windows con app pool de 32 bits; la publicación usa el runtime ya instalado allá.
      - name: Publicar la API
        run: dotnet publish src/AgendaSalon.Api --configuration Release --runtime win-x86 --self-contained false --output publicacion

      # Paso propio en lugar de una acción de terceros: la contraseña va como variable de entorno secreta,
      # se valida el certificado del servidor y AppOffline evita apagar el sitio mientras se copian los archivos.
      - name: Subir con Web Deploy
        shell: pwsh
        env:
          SITIO: ${{ vars.MONSTERASP_SITIO }}
          SERVIDOR: ${{ vars.MONSTERASP_SERVIDOR }}
          CONTRASENA: ${{ secrets.MONSTERASP_CONTRASENA }}
        run: |
          $msdeploy = 'C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          $origen = (Resolve-Path publicacion).Path
          $destino = "contentPath=$env:SITIO,computerName=$env:SERVIDOR/MsDeploy.axd?site=$env:SITIO,userName=$env:SITIO,password=$env:CONTRASENA,authType=Basic"
          & $msdeploy -verb:sync -enableRule:AppOffline -enableRule:DoNotDeleteRule "-source:contentPath=$origen" "-dest:$destino"
          if ($LASTEXITCODE -ne 0) { throw "Web Deploy terminó con el código $LASTEXITCODE." }

      # La primera petición arranca la aplicación (y aplica las migraciones): se reintenta un rato.
      - name: Comprobar que la API responde
        shell: pwsh
        run: |
          for ($intento = 1; $intento -le 12; $intento++) {
            try {
              $respuesta = Invoke-WebRequest "${{ vars.API_URL }}/salud" -UseBasicParsing -TimeoutSec 30
              if ($respuesta.StatusCode -eq 200) { Write-Host "La API responde: $($respuesta.Content)"; exit 0 }
            } catch { Write-Host "Intento ${intento}: todavía no responde." }
            Start-Sleep -Seconds 15
          }
          throw 'La API no respondió después del despliegue.'

  desplegar-web:
    name: Publicar la web en GitHub Pages
    needs: [compilar-y-probar, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir para GitHub Pages
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages no sabe de rutas de React: con 404.html igual a index.html, /AgendaSalon/panel también carga la app.
      - name: Permitir rutas de la aplicación
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
