name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # La restauración falla si algún paquete tiene vulnerabilidades conocidas
      # (las advertencias de NuGet se tratan como errores en Directory.Build.props).
      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      # Las pruebas de integración usan SQLite en memoria, así que no hace falta SQL Server.
      - name: Ejecutar pruebas
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFilePrefix=resultados"
          --results-directory resultados-pruebas

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: resultados-pruebas
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm run test:ci

      # El build también revisa los tipos con tsc.
      - name: Build
        run: npm run build
